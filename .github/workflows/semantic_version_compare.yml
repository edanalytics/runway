name: Compare template versions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - cloudformation/**

permissions:
  contents: read

jobs:
  version_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compare version numbers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          failed=0

          must_increase() {
            file="$1"
            version_name="$2"
            reason="$3"
            current=$(git show "$BASE_SHA:$file" | grep -m 1 "Value: '[0-9]*\.[0-9]*\.[0-9]*'" | awk -F"'" '{print $2}')
            new=$(grep -m 1 "Value: '[0-9]*\.[0-9]*\.[0-9]*'" "$file" | awk -F"'" '{print $2}')

            echo "$reason"
            echo "$version_name in $file: base=$current, incoming=$new"
            if [ "$(printf '%s\n' "$current" "$new" | sort -V | tail -n1)" = "$current" ]; then
              echo "::error file=$file::Increase $version_name from $current to a higher semantic version. The incoming value is $new."
              failed=1
            else
              echo "Version check passed for $file"
            fi
          }

          # 0-waf.yml is its own stack. 1-main.yml only receives the Web ACL ARN as a parameter.
          if printf '%s\n' "$files" | grep -qx 'cloudformation/templates/0-waf.yml'; then
            must_increase \
              "cloudformation/templates/0-waf.yml" \
              "Outputs.BaseVersion" \
              "0-waf.yml changed. Because WAF is a standalone stack, increase its own Outputs.BaseVersion."
          fi

          others=$(printf '%s\n' "$files" | grep '^cloudformation/' | grep -v '^cloudformation/templates/0-waf.yml$' || true)
          if [ -n "$others" ]; then
            echo "CloudFormation files that are part of the main stack changed:"
            printf '%s\n' "$others"
            must_increase \
              "cloudformation/templates/1-main.yml" \
              "Outputs.TemplateVersion" \
              "These files are deployed through 1-main.yml, so increase its Outputs.TemplateVersion."
          fi

          if [ "$failed" -ne 0 ]; then
            echo "Version check failed. Update each version identified above and push the change to this pull request."
            exit 1
          fi

          echo "Version check passed"
